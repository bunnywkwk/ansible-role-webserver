---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # Static import by galaxy name (meta/main.yml): Molecule and ansible-lint
    # link this checkout as bunnywkwk.webserver, so CI tests this change and
    # ansible-lint's syntax-check reads the role's tasks too.
    - name: Run the role from this checkout
      ansible.builtin.import_role:
        name: bunnywkwk.webserver
