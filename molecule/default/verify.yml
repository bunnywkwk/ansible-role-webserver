---
# Expected values are written out, not read from defaults/: the test is the
# spec, so a change to the page must be a deliberate change here too.
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    expected_port: 80
    expected_message: Hello from the lab
  tasks:
    - name: Collect service states
      ansible.builtin.service_facts:

    - name: Nginx is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'
        fail_msg: nginx is not running and enabled

    # uri fails on anything but HTTP 200.
    - name: Get the page
      # checkov:skip=CKV2_ANSIBLE_1: test-only request to the container's nginx
      ansible.builtin.uri:
        url: "http://localhost:{{ expected_port }}/"
        return_content: true
      register: page

    - name: The page shows the message
      ansible.builtin.assert:
        that: expected_message in page.content
        fail_msg: "Page does not contain '{{ expected_message }}'"
