---
driver:
  name: podman
platforms:
  # MOLECULE_RUN_ID (set by CI) keeps container names unique when several
  # branches build at once; a local run uses "local".
  - name: webserver-ubi9-${MOLECULE_RUN_ID:-local}
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Containers have no firewalld.
        webserver_manage_firewall: false
verifier:
  name: ansible
scenario:
  # Written out so CI's checks are visible here and do not change with a
  # Molecule upgrade. prepare, side_effect and cleanup have no playbook here.
  # No syntax step: the Ansible lint gate already syntax-checks
  # converge.yml, and through import_role the role's tasks too.
  test_sequence:
    # Installs the podman driver's own collection (containers.podman); the
    # role's collections come from ../../requirements.yml in the prerun.
    - dependency
    - destroy      # remove leftovers from an aborted run
    - create       # 1 x ubi9-init with systemd
    - converge     # run the role
    - idempotence  # run again: must report 0 changed
    - verify       # nginx up, page served with the message
    - destroy
